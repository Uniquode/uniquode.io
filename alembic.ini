[alembic]
script_location = src/data_core/migrations
version_path_separator = os
prepend_sys_path = .
path_separator = os
# The runtime database URL is resolved in src/data_core/migrations/env.py.
# Explicit overrides can target PostgreSQL or in-memory SQLite; otherwise local
# development uses the project-root SQLite file by default.
sqlalchemy.url =
default_database_url = sqlite+aiosqlite:///uniquode.sqlite3
default_modules = web_core,public,uniquode,auth_ext

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
