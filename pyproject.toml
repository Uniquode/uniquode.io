[project]
name = "uniquode"
version = "0.1.0"
description = "Local uv workspace for coordinated Uniquode and Wevra development"
requires-python = ">=3.13"
dependencies = [
    "app",
    "wevra",
]

[dependency-groups]
dev = [
    "httpx2>=2.3.0",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "ruff>=0.15.16",
    "ty>=0.0.44",
]

[tool.uv]
package = false

[tool.uv.sources]
app = { workspace = true }
wevra = { workspace = true }

[tool.uv.workspace]
members = [
    "app",
    "wevra",
]

[tool.ruff]
line-length = 88
src = [
    "app/src",
    "app/tests",
]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
