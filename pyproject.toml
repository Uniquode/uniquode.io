[project]
name = "uniquode-io"
version = "0.1.0"
description = "FastAPI based website for uniquode.io"
authors = [
    { name = "David Nugent", email = "davidn@uniquode.io" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "starlette>=1.6.0",
    "wybra[cache,keychain,postgresql]",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["uniquode_io"]

[tool.uv.sources]
wybra = { git = "https://github.com/Uniquode/wybra.git", branch = "main" }
# wybra = { path = "../wybra", editable = true }

[dependency-groups]
dev = [
    "httpx2>=2.10.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
    "ty>=0.0.70",
]

[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
