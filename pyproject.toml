[project]
name = "uniquode-io"
version = "0.1.0"
description = "FastAPI based website for uniquode.io"
authors = [
    { name = "David Nugent", email = "davidn@uniquode.io" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.137.2",
    "starlette>=1.2.1",
    "wybra",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["uniquode_io"]

[tool.uv.sources]
wybra = { git = "https://github.com/Uniquode/wybra.git", branch = "main" }
# wybra = { path = "../wybra", editable = true }

[dependency-groups]
dev = [
    "httpx2>=2.3.0",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "ruff>=0.15.16",
    "ty>=0.0.50",
]

[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
