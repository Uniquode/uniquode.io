[app]
name = "uniquode"
deployment_environment = "local"
modules = [
  "uniquode_io",
  "wybra.secrets",
  "wybra.widgets",
  "wybra.messages",
  "wybra.assets",
  "wybra.security",
  "wybra.forms",
  "wybra.api",
  "wybra.template",
  "wybra.errors",
  "wybra.db",
  "wybra.auth",
  "wybra.providers",
  "wybra.media",
  "wybra.profile",
]

[app.database]
backend = "sqlite"
database = "uniquode.io.sqlite3"

[app.routes]
uniquode_io = { default = "" }
wybra-widgets = { partials = "", api = "" }
wybra-profile = { profile = "" }
wybra-security = {}
wybra-forms = {}
wybra-api = {}
wybra-template = {}
wybra-errors = {}
wybra-auth = { account = "/account", api = "" }
wybra-providers = { google = "/account/providers/google", github = "/account/providers/github", apple = "/account/providers/apple" }

[app.runserver]
asgi_app = "uniquode_io.asgi:app"
reload_env = "APP_RELOAD"

[wybra.widgets]
features = ["theme", "login"]

[wybra.sessions]
storage_backend = "database"
database_connection_name = "default"

[wybra.messages]
storage_backend = "session"

[wybra.forms]
csrf_token_secret_source = "keychain"
csrf_token_secret_key = "auth/forms/csrf-token-secret/current"

[wybra.media]
root = "media"
mount_path = "/media"
serve = true
url_mode = "storage-key"

[app.templates]
auto_reload = true
cache_size = 0

[app.assets]
url_path = "/static/"
root = "static"
serve = true

[log]
version = 1
disable_existing_loggers = false

[log.formatters.simple]
format = "%(asctime)s %(levelname)s %(name)s %(message)s"
datefmt = "%Y-%m-%dT%H:%M:%S%z"

[log.handlers.console]
class = "logging.StreamHandler"
level = "INFO"
formatter = "simple"
stream = "ext://sys.stderr"

[log.root]
level = "WARNING"
handlers = ["console"]

[log.loggers.tortoise]
level = "WARNING"

[auth]
session_cookie_name = "uniquode_session"
totp_mode = "opt_in"
passkey_enabled = true
# Local development leaves session_cookie_force_secure unset so HTTP works.
# Non-local deployments must set SESSION_FORCE_SECURE=true or configure
# session_cookie_force_secure = true in deployment-specific config.

[auth.passkeys]
rp_id = "localhost"
rp_name = "Uniquode Dev"
allowed_origins = ["http://localhost:8000"]
timeout_seconds = 300
user_verification = "preferred"
user_verification_satisfies_totp = true
attestation = "none"
discoverable_credentials = "preferred"
counter_policy = "reject-regression"

[secrets.crypto]
source = "keychain"
current_key = "WYBRA_SECRET_KEY_CURRENT"
previous_keys = "WYBRA_SECRET_KEYS_PREVIOUS"

[secrets.keychain]
appname = "wybra"

[auth.providers.google]
enabled = true
client_id = "google-dev-client-id"
secrets = "keychain"
client_secret_key = "auth/providers/google/dev/client-secret"
account_creation_enabled = true
email_match_linking_enabled = true
required_claims = ["sub", "email", "email_verified"]

[auth.providers.github]
enabled = true
client_id = "github-dev-client-id"
secrets = "keychain"
client_secret_key = "auth/providers/github/dev/client-secret"
account_creation_enabled = true
email_match_linking_enabled = true
required_claims = ["id", "email", "email_verified"]

[auth.providers.apple]
enabled = true
client_id = "io.uniquode.dev.web"
team_id = "APPLE_DEV_TEAM_ID"
key_id = "APPLE_DEV_KEY_ID"
secrets = "keychain"
private_key_secret_key = "auth/providers/apple/dev/private-key"
account_creation_enabled = true
email_match_linking_enabled = true
required_claims = ["sub", "email", "email_verified"]

[auth.password.policy]
minimum_length = 12
minimum_character_categories = 2
minimum_strength = 0.45
common_fragments = [
  "admin",
  "changeme",
  "changeit",
  "letmein",
  "p4ssw0rd",
  "pass",
  "password",
  "qwerty",
  "test",
  "tester",
  "welcome",
]
