[app]
name = "uniquode"
database_url = "sqlite+aiosqlite:///uniquode.io.sqlite3"
modules = [
  "uniquode_io",
  "wybra.widgets",
  "wybra.assets",
  "wybra.security",
  "wybra.forms",
  "wybra.api",
  "wybra.template",
  "wybra.errors",
  "wybra.db",
  "wybra.secrets",
  "wybra.auth",
  "wybra.providers",
  "wybra.media",
  "wybra.profile",
]

[app.routes]
uniquode_io = { default = "" }
wybra-widgets = { partials = "", api = "" }
wybra-profile = { profile = "" }
wybra-security = {}
wybra-forms = {}
wybra-api = {}
wybra-template = {}
wybra-errors = {}
wybra-auth = { account = "/account", api = "" }

[app.runserver]
asgi_app = "uniquode_io.asgi:app"
reload_env = "APP_RELOAD"

[wybra.widgets]
features = ["theme", "login"]

[wybra.media]
root = "media"
mount_path = "/media"
serve = true
url_mode = "storage-key"

[app.templates]
auto_reload = true
cache_size = 0

[app.assets]
url_path = "/static/"
root = "static"
serve = true

[log]
version = 1
disable_existing_loggers = false

[log.formatters.simple]
format = "%(levelname)-5.5s [%(name)s] %(message)s"

[log.handlers.console]
class = "logging.StreamHandler"
level = "INFO"
formatter = "simple"
stream = "ext://sys.stderr"

[log.root]
level = "WARNING"
handlers = ["console"]

[log.loggers.alembic]
level = "INFO"

[log.loggers."sqlalchemy.engine"]
level = "WARNING"

[auth]
session_cookie_name = "uniquode_session"
totp_mode = "opt_in"
# Local development leaves session_cookie_force_secure unset so HTTP works.
# Non-local deployments must set SESSION_FORCE_SECURE=true or configure
# session_cookie_force_secure = true in deployment-specific config.

[secrets.crypto]
source = "keychain"
current_key = "WYBRA_SECRET_KEY_CURRENT"
previous_keys = "WYBRA_SECRET_KEYS_PREVIOUS"

[secrets.keychain]
appname = "wybra"

[auth.providers.google]
enabled = true
client_id = "google-dev-client-id"
secrets = "keychain"
client_secret_key = "auth/providers/google/dev/client-secret"
account_creation_enabled = false
required_claims = ["sub", "email", "email_verified"]

[auth.password.policy]
minimum_length = 12
minimum_character_categories = 2
minimum_strength = 0.45
common_fragments = [
  "admin",
  "changeme",
  "changeit",
  "letmein",
  "p4ssw0rd",
  "pass",
  "password",
  "qwerty",
  "test",
  "tester",
  "welcome",
]
