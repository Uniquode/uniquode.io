name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    env:
      APP_CONFIG: uniquode.io.toml

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Linux keychain dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dbus-user-session \
            gnome-keyring \
            libsecret-tools

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version-file: pyproject.toml

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Check Wybra dependency source
        run: python ci/ensure_wybra_git_source.py check

      - name: Check formatting
        run: uv run ruff format --check ci src tests

      - name: Lint
        run: uv run ruff check ci src tests

      - name: Type check
        run: uv run ty check src/

      - name: Test
        run: |
          dbus-run-session -- bash <<'SH'
          set -euo pipefail

          export XDG_DATA_HOME="${RUNNER_TEMP}/xdg-data"
          mkdir -p "${XDG_DATA_HOME}/keyrings"
          keyring_env="$(mktemp)"
          keyring_password="$(python - <<'PY'
          import secrets

          print(secrets.token_urlsafe(32))
          PY
          )"
          printf '%s\n' "$keyring_password" \
            | gnome-keyring-daemon --unlock --components=secrets >"$keyring_env"
          set -a
          . "$keyring_env"
          set +a

          uv run python ci/seed_core_secrets.py | uv run wybra-secret --config uniquode.io.toml set --json

          uv run pytest -q
          SH

  smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    env:
      APP_CONFIG: uniquode.io.toml
      # Ephemeral superuser password for the throwaway Postgres service
      # container below, torn down at the end of this job. Derived from
      # run identifiers (not a fixed dictionary word) so secret scanners
      # don't flag it as a leaked credential.
      POSTGRES_SUPERUSER_PASSWORD: smoke-${{ github.run_id }}-${{ github.run_attempt }}

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: smoke-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Linux keychain dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dbus-user-session \
            gnome-keyring \
            libsecret-tools

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version-file: pyproject.toml

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Run smoke test
        env:
          RUNNER_TEMP: ${{ runner.temp }}
          POSTGRES_SUPERUSER_PASSWORD: ${{ env.POSTGRES_SUPERUSER_PASSWORD }}
        run: dbus-run-session -- bash ./smoke_test.sh
