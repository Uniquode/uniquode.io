name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check out temporary Wevra dependency source
        uses: actions/checkout@v6
        with:
          repository: Uniquode/wevra
          path: wevra

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version-file: pyproject.toml

      - name: Install dependencies
        run: uv sync --locked --package app --group dev

      - name: Check formatting
        run: uv run ruff format --check app/src app/tests

      - name: Lint
        run: uv run ruff check app/src app/tests

      - name: Type check
        run: uv --directory app run ty check src/

      - name: Test
        run: uv run pytest app/tests -q
