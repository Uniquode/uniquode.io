name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    env:
      APP_CONFIG: uniquode.io.toml
      WYBRA_KEYRING_PASSWORD: uniquode-ci-keyring

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Linux keychain dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dbus-user-session \
            gnome-keyring \
            libsecret-tools

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version-file: pyproject.toml

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Check Wybra dependency source
        run: python scripts/wybra_source.py check git -q

      - name: Check formatting
        run: uv run ruff format --check src tests scripts

      - name: Lint
        run: uv run ruff check src tests scripts

      - name: Type check
        run: uv run ty check src/

      - name: Test
        run: |
          dbus-run-session -- bash <<'SH'
          set -euo pipefail

          export XDG_DATA_HOME="${RUNNER_TEMP}/xdg-data"
          mkdir -p "${XDG_DATA_HOME}/keyrings"
          keyring_env="$(mktemp)"
          printf '%s\n' "$WYBRA_KEYRING_PASSWORD" \
            | gnome-keyring-daemon --unlock --components=secrets >"$keyring_env"
          set -a
          . "$keyring_env"
          set +a

          uv run python - <<'PY' | uv run wybra-secret --config uniquode.io.toml set --json
          import base64
          import json
          import zlib

          from cryptography.fernet import Fernet

          encoded_key = Fernet.generate_key().decode("ascii")
          raw_key = base64.urlsafe_b64decode(encoded_key)
          checksum = f"{zlib.crc32(raw_key) & 0xFFFFFFFF:08x}"
          print(
              json.dumps(
                  {
                      "WYBRA_SECRET_KEY_CURRENT": f"ci:{encoded_key}:{checksum}",
                      "auth/providers/google/dev/client-secret": (
                          "ci-google-client-secret"
                      ),
                  }
              )
          )
          PY

          uv run pytest -q
          SH
