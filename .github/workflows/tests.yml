name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    env:
      APP_CONFIG: uniquode.io.toml

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Linux keychain dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dbus-user-session \
            gnome-keyring \
            libsecret-tools

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version-file: pyproject.toml

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Check Wybra dependency source
        run: python ci/ensure_wybra_git_source.py check

      - name: Check formatting
        run: uv run ruff format --check ci src tests

      - name: Lint
        run: uv run ruff check ci src tests

      - name: Type check
        run: uv run ty check src/

      - name: Test
        run: |
          dbus-run-session -- bash <<'SH'
          set -euo pipefail

          export XDG_DATA_HOME="${RUNNER_TEMP}/xdg-data"
          mkdir -p "${XDG_DATA_HOME}/keyrings"
          keyring_env="$(mktemp)"
          keyring_password="$(python - <<'PY'
          import secrets

          print(secrets.token_urlsafe(32))
          PY
          )"
          printf '%s\n' "$keyring_password" \
            | gnome-keyring-daemon --unlock --components=secrets >"$keyring_env"
          set -a
          . "$keyring_env"
          set +a

          uv run python - <<'PY' | uv run wybra-secret --config uniquode.io.toml set --json
          import base64
          import json
          import secrets
          import zlib

          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric import ec
          from cryptography.fernet import Fernet

          encoded_key = Fernet.generate_key().decode("ascii")
          raw_key = base64.urlsafe_b64decode(encoded_key)
          checksum = f"{zlib.crc32(raw_key) & 0xFFFFFFFF:08x}"
          apple_private_key = ec.generate_private_key(ec.SECP256R1())
          apple_private_key_pem = apple_private_key.private_bytes(
              encoding=serialization.Encoding.PEM,
              format=serialization.PrivateFormat.PKCS8,
              encryption_algorithm=serialization.NoEncryption(),
          ).decode("ascii")
          print(
              json.dumps(
                  {
                      "secrets/key/dev/current": f"ci:{encoded_key}:{checksum}",
                      "auth/forms/csrf-token-secret/dev/current": (
                          secrets.token_urlsafe(32)
                      ),
                      "auth/providers/google/dev/client-secret": (
                          secrets.token_urlsafe(32)
                      ),
                      "auth/providers/github/dev/client-secret": (
                          secrets.token_urlsafe(32)
                      ),
                      "auth/providers/apple/dev/private-key": apple_private_key_pem,
                  }
              )
          )
          PY

          uv run pytest -q
          SH
