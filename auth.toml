[auth]
database_url = "sqlite+aiosqlite:///uniquode.sqlite3"
# Local development default only. Non-local deployments must set this to true;
# do not copy this sample into production as-is.
session_cookie_force_secure = false

[auth.password.policy]
minimum_length = 12
minimum_character_categories = 2
minimum_strength = 0.45
common_fragments = [
  "admin",
  "changeme",
  "changeit",
  "letmein",
  "p4ssw0rd",
  "pass",
  "password",
  "qwerty",
  "test",
  "tester",
  "welcome",
]
